name: Weekly Trend Stock Scan

on:
  # 매주 월요일 06:00 KST = 일요일 21:00 UTC
  schedule:
    - cron: '0 21 * * SUN'
  # 수동 트리거 (Actions 탭에서 'Run workflow' 버튼)
  workflow_dispatch:
    inputs:
      date:
        description: '트리거 일자 (YYYY-MM-DD), 비우면 today'
        required: false
        default: ''
      skip_trends:
        description: '트렌드 수집 스킵 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write    # archive/ 커밋용
  pages: write       # GitHub Pages 배포용
  id-token: write

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          TZ: Asia/Seoul
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.skip_trends }}" = "true" ]; then
            ARGS="$ARGS --skip-trends"
          fi
          echo "Running: python main.py $ARGS"
          python main.py $ARGS

      - name: Commit & push archive
        run: |
          git config user.name  "trend-scanner-bot"
          git config user.email "actions@github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "변경된 archive 파일 없음 — 커밋 스킵"
          else
            DATE=$(date +'%Y-%m-%d')
            git commit -m "📊 Auto scan: $DATE"
            git push
          fi

      # GitHub Pages 자동 배포 (archive/를 source로 설정한 경우 별도 액션 불필요)
      # main 브랜치 push 후 Pages가 자동 빌드/배포함.
