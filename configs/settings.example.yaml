# Trend Stock Scanner — 사용자 활성 설정 (모든 트렌드 소스 활성화)
# Reddit은 키 없어도 익명 모드(JSON API)로 자동 동작
# Google은 RSS 우선, 실패 시 pytrends fallback

screening:
  vol_2w_days: 14
  vol_2w_4w_days: 14
  vol_4w_8w_days: 28
  primary_min_ratio: 1.30
  secondary_ratio: 2.0
  min_avg_volume: 50000
  exclude_etf: true
  exclude_spac: true
  exclude_preferred: true

trends:
  google: true               # RSS 우선 + pytrends fallback
  naver: true                # ✅ 동작 확인됨
  reddit: true               # 키 없으면 익명 JSON 모드 자동
  web_search: true           # DuckDuckGo HTML
  top_n_per_source: 25

momentum:
  weight_volume: 0.45
  weight_trend: 0.35
  weight_theme_density: 0.20
  classification:
    strong: 75
    notable: 60
    watch: 45

output:
  archive_dir: archive
  excel_filename: report.xlsx
  html_filename: index.html
  keep_history_days: 365
  # ↓ 메인 허브 표시 범위 조절 (archive 폴더 자체는 영구 보존)
  history_chart_weeks: 26      # 시계열 차트에 표시할 최근 주 수 (26주 = 6개월)
  history_list_count: 52       # 일자별 카드 목록 표시할 최신 건수 (52건 = 1년치)
  show_rolling_comparison: true  # 최근 4주 vs 직전 4주 비교 카드 표시

timezone: Asia/Seoul
